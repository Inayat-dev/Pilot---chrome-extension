<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; padding: 12px; font-family: Arial, sans-serif; }
    textarea { width: 100%; height: 60px; margin-bottom: 8px; }
    button { width: 100%; padding: 8px; background: #2ea6ff; color: white; border: none; cursor: pointer; }
    #status { margin-top: 6px; font-size: 0.85em; }
  </style>
</head>
<body>
  <h3>Send to active chat</h3>
  <textarea id="msg" placeholder="Type your message..."></textarea>
  <button id="send">Send</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
