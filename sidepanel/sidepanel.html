<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pilot</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 3.5L19 9.8 13 12l-2.2 6L6 3.5Z" fill="currentColor"/>
      </svg>
      <span class="brand-name">Pilot</span>
    </div>
    <div class="topbar-actions">
      <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 2.5v2M10 15.5v2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M2.5 10h2M15.5 10h2M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="10" cy="10" r="3.4" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.3 2.6h3.4l.5 2.1c.5.2 1 .4 1.4.7l2-.8 2.4 2.9-1.3 1.7c.1.5.1 1 0 1.6l1.3 1.7-2.4 2.9-2-.8c-.4.3-.9.5-1.4.7l-.5 2.1H8.3l-.5-2.1a6 6 0 0 1-1.4-.7l-2 .8L2 12.5l1.3-1.7a5.7 5.7 0 0 1 0-1.6L2 7.5l2.4-2.9 2 .8c.4-.3.9-.5 1.4-.7l.5-2.1Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </header>

  <div class="provider-row" id="providerRow">
    <span class="dot-ring"><span class="dot" id="providerDot"></span></span>
    <span id="providerLabel">No provider configured</span>
    <label class="approval-toggle" id="approvalToggle" title="On: Pilot pauses before every click/type/navigate and shows Approve/Reject, with the cursor pointing at the target. Off (default): Pilot runs the whole task automatically.">
      <input type="checkbox" id="approvalCheckbox" />
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Confirm steps</span>
    </label>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab active" id="tabRunBtn" role="tab" aria-selected="true">Run</button>
    <button class="tab" id="tabHistoryBtn" role="tab" aria-selected="false">History</button>
  </nav>

  <main class="log" id="log">
    <div class="empty-state" id="emptyState">
      <p class="empty-title">Tell Pilot what to do on this page.</p>
      <p class="empty-sub">It reads the visible page, decides one small step at a time, and shows every step below as it happens.</p>
    </div>
  </main>

  <section class="panel history-panel" id="historyPanel" hidden>
    <div class="history-head">
      <span class="history-title">Recent runs</span>
      <button id="clearHistoryBtn" class="link-btn">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <p class="empty-sub history-empty" id="historyEmpty">No runs yet — finished tasks will show up here.</p>
    </div>
  </section>

  <footer class="composer">
    <textarea id="goalInput" placeholder="e.g. Find the pricing page and list the plan names" rows="2"></textarea>
    <div class="composer-row">
      <span class="hint" id="stepHint"></span>
      <div class="composer-actions">
        <button id="copyBtn" class="icon-btn" title="Copy transcript" aria-label="Copy transcript" hidden>
          <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6.2" y="6.2" width="9.3" height="9.3" rx="1.6" stroke="currentColor" stroke-width="1.2"/><path d="M12 6.2V4.6a1.6 1.6 0 0 0-1.6-1.6H4.6A1.6 1.6 0 0 0 3 4.6v5.8a1.6 1.6 0 0 0 1.6 1.6H6.2" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button id="stopBtn" class="btn btn-ghost" hidden>Stop</button>
        <button id="runBtn" class="btn btn-primary">Run</button>
      </div>
    </div>
  </footer>

  <div class="toast-stack" id="toastStack"></div>

  <script src="../lib/vendor/xlsx.min.js"></script>
  <script src="../lib/vendor/jspdf.min.js"></script>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
